<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ module|capitalize }} • Models</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px; }
    a { color: #38bdf8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .card { background:#0b1220; border:1px solid #1f2937; border-radius:12px; padding:16px; }
    .title { margin:0 0 4px; font-size:18px; color:#93c5fd; }
    .crumbs { margin-bottom: 12px; opacity: .8; }
    .home { margin-right: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="crumbs"><a class="home" href="/">Home</a> / {{ module|capitalize }}</div>
        <h1 style="margin:0">{{ module|capitalize }} Models</h1>
      </div>
      <a href="/" style="background:#22c55e; color:#052e16; padding:8px 12px; border-radius:8px; font-weight:600;">← Back</a>
    </div>

    <div class="grid">
      {% for name, _ in models %}
      <div class="card">
        <h3 class="title">{{ name }}</h3>
        <div>Browse rows for this model.</div>
        <div style="margin-top:10px">
          <a href="/browse/{{ module }}/{{ name }}">View rows →</a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
